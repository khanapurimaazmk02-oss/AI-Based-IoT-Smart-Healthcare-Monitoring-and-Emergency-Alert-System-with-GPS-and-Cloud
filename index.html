<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Medimonitor · ICU Bedside · ESP32 REAL DATA</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Maps API -->
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB41DRUbKWJHPxaFjMAwdrzWzbVKartNGg&libraries=places&loading=async"
        defer></script>
    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.js"></script>
    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#02191c">
    <link rel="apple-touch-icon" href="icon-192x192.png">

    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', 'Courier New', monospace;
        }

        html,
        body {
            overflow-x: hidden;
            background: #02191c;
            height: 100%;
        }

        body {
            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 234, 255, 0.4) transparent;
        }

        body::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        body::-webkit-scrollbar-track {
            background: transparent;
        }

        body::-webkit-scrollbar-thumb {
            background: rgba(0, 234, 255, 0.4);
            border-radius: 10px;
        }

        /* ----- AUTH SCREEN ----- */
        .auth-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }

        .auth-card {
            background: #1e293b;
            border-radius: 32px;
            padding: 32px 24px;
            width: 100%;
            max-width: 440px;
            border: 1px solid #0ea5e9;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00eaff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-tab {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
            background: #334155;
            padding: 6px;
            border-radius: 40px;
        }

        .auth-tab button {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #cbd5e1;
            border-radius: 32px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }

        .auth-tab button.active {
            background: linear-gradient(135deg, #00eaff, #38bdf8);
            color: #02191c;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .auth-form input {
            width: 100%;
            padding: 16px;
            background: #334155;
            border: 1px solid #0ea5e9;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
        }

        .auth-form input:focus {
            outline: none;
            box-shadow: 0 0 10px #00eaff;
        }

        .auth-btn {
            background: linear-gradient(135deg, #00eaff, #38bdf8);
            color: #02191c;
            border: none;
            padding: 16px;
            border-radius: 32px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px #00eaff;
        }

        .auth-error {
            color: #ef4444;
            text-align: center;
            min-height: 24px;
            font-size: 0.9rem;
        }

        .auth-toggle-text {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
        }

        .auth-toggle-text span {
            color: #00eaff;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-container.hidden {
            display: none;
        }

        /* ----- MAIN APP ----- */
        .app {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            background: #02191c;
        }

        .app.visible {
            display: flex;
        }

        /* ----- NAVBAR with mobile hamburger ----- */
        .navbar {
            background: rgba(10, 42, 47, 0.95);
            backdrop-filter: blur(8px);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00eaff;
            flex-wrap: wrap;
            gap: 0.5rem;
            box-shadow: 0 0 20px rgba(0, 234, 255, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00eaff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.2rem;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex: 1 1 auto;
            justify-content: center;
        }

        .nav-links::-webkit-scrollbar {
            display: none;
        }

        .nav-links a {
            color: #a0e0e8;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(0, 234, 255, 0.15);
            border-color: #00eaff;
            color: #00eaff;
            box-shadow: 0 0 15px rgba(0, 234, 255, 0.3);
        }

        .mobile-menu-toggle {
            display: none;
            background: transparent;
            border: 1px solid #00eaff;
            color: #00eaff;
            padding: 8px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .mobile-dropdown {
            display: none;
            position: absolute;
            top: 70px;
            right: 20px;
            background: #0a2a2f;
            border: 2px solid #00eaff;
            border-radius: 16px;
            flex-direction: column;
            padding: 10px 0;
            z-index: 1000;
            min-width: 200px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .mobile-dropdown a {
            color: #a0e0e8;
            padding: 12px 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mobile-dropdown a:hover {
            background: rgba(0, 234, 255, 0.1);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .mobile-menu-toggle {
                display: block;
            }
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .welcome-message {
            color: #a0e0e8;
            font-size: 0.95rem;
            padding: 5px 10px;
            background: rgba(0, 234, 255, 0.1);
            border-radius: 20px;
            white-space: nowrap;
        }


        .logout-btn {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
        }

        .install-btn {
            background: linear-gradient(135deg, #00eaff, #38bdf8);
            border: none;
            color: #02191c;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            font-weight: bold;
        }

        .install-btn:hover {
            box-shadow: 0 0 15px #00eaff;
            transform: translateY(-1px);
        }

        /* ----- ESP STATUS BAR ----- */
        .esp-status-bar {
            background: #0f2f34;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            border-bottom: 1px solid #0a3c44;
            position: sticky;
            top: 73px;
            z-index: 99;
        }

        .esp-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a0e0e8;
            font-size: 0.9rem;
        }

        .esp-indicator i.fa-circle {
            font-size: 0.7rem;
            transition: color 0.3s ease;
        }

        .timestamp-badge {
            color: #6b8e94;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .patient-status-badge {
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .status-normal {
            background: #00ff9d20;
            color: #00ff9d;
            border: 1px solid #00ff9d;
        }

        .status-warning {
            background: #ffd60020;
            color: #ffd600;
            border: 1px solid #ffd600;
        }

        .status-critical {
            background: #ef444420;
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .status-waiting {
            background: #ffd60020;
            color: #ffd600;
            border: 1px solid #ffd600;
        }

        /* ----- ALARM ANIMATION ----- */
        .alarm-blink {
            animation: alarmBlink 1s infinite;
        }

        @keyframes alarmBlink {
            0% {
                background-color: rgba(239, 68, 68, 0.2);
                border-color: #ef4444;
            }

            50% {
                background-color: rgba(239, 68, 68, 0.6);
                border-color: #ff0000;
                box-shadow: 0 0 30px #ef4444;
            }

            100% {
                background-color: rgba(239, 68, 68, 0.2);
                border-color: #ef4444;
            }
        }

        @keyframes fcmSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ----- PAGE CONTAINERS (SPA) ----- */
        .page-container {
            display: none;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }

        .page-container.active-page {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0.5;
            }

            to {
                opacity: 1;
            }
        }

        /* ----- ICU DASHBOARD LAYOUT (mobile responsive) ----- */
        .icu-dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .waveform-panel {
            flex: 3;
            min-width: 300px;
            background: #02191c;
            border: 2px solid #0a3c44;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 234, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .icu-dashboard {
                flex-direction: column;
            }

            .waveform-panel {
                width: 100%;
            }

            .vital-value {
                font-size: 3rem;
            }
        }

        @media (max-width: 480px) {
            .vital-value {
                font-size: 2.5rem;
            }

            .vital-mini .value {
                font-size: 1.8rem;
            }

            .esp-status-bar {
                gap: 15px;
                padding: 8px 10px;
            }
        }

        .waveform-container {
            background: #02191c;
            border: 1px solid #0a3c44;
            border-radius: 16px;
            padding: 10px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .waveform-label {
            position: absolute;
            top: 12px;
            left: 20px;
            color: #00eaff;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: 0 0 8px #00eaff;
            z-index: 10;
            background: rgba(2, 25, 28, 0.8);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #0a3c44;
        }

        .waveform-canvas {
            width: 100%;
            height: 120px;
            display: block;
            background: #02191c;
            border-radius: 12px;
        }

        .vitals-panel {
            flex: 1;
            min-width: 250px;
            background: #02191c;
            border: 2px solid #0a3c44;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 0 30px rgba(0, 234, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .vital-block {
            text-align: center;
            padding: 15px;
            background: rgba(10, 42, 47, 0.5);
            border-radius: 20px;
            border: 1px solid #0a3c44;
            transition: all 0.3s;
        }

        .vital-block.alarm-blink {
            animation: alarmBlink 1s infinite;
        }

        .vital-label {
            color: #6b8e94;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .vital-value {
            font-family: 'Courier New', monospace;
            font-size: 4rem;
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 0 0 20px currentColor;
        }

        .vital-unit {
            font-size: 1.2rem;
            color: #a0e0e8;
            margin-left: 5px;
        }

        .bpm {
            color: #00eaff;
        }

        .spo2 {
            color: #00ff9d;
        }

        .temp {
            color: #ffffff;
        }

        .vital-row {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #0a3c44;
            padding-top: 20px;
            margin-top: 10px;
        }

        .vital-mini {
            text-align: center;
            flex: 1;
        }

        .vital-mini .value {
            font-family: 'Courier New', monospace;
            font-size: 2.2rem;
            font-weight: 600;
            color: #e6faff;
            text-shadow: 0 0 10px currentColor;
        }

        .resp {
            color: #ffd600;
        }

        /* ----- DOCUMENTS MODULE ----- */
        .documents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .document-card {
            background: #0a2a2f;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #0a3c44;
            transition: 0.2s;
        }

        .document-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 20px rgba(0, 234, 255, 0.3);
        }

        .document-icon {
            font-size: 2.5rem;
            color: #00eaff;
            margin-bottom: 15px;
        }

        .document-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .doc-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .doc-action.download {
            background: linear-gradient(135deg, #00eaff, #008b9c);
            color: white;
        }

        .doc-action.delete {
            background: #ef4444;
            color: white;
        }

        .upload-area {
            border: 2px dashed #00eaff;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(0, 234, 255, 0.05);
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: rgba(0, 234, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 234, 255, 0.2);
        }

        /* ----- CALENDAR MODULE with medicine adder ----- */
        .calendar-container {
            background: #0a2a2f;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #0a3c44;
            overflow-x: auto;
        }

        .fc {
            background: #0f2f34;
            padding: 20px;
            border-radius: 20px;
            color: white;
            min-width: 600px;
        }

        .fc-toolbar-title {
            color: #00eaff !important;
        }

        .fc-button {
            background: linear-gradient(135deg, #00eaff, #008b9c) !important;
            border: none !important;
            color: #02191c !important;
            font-weight: 600 !important;
        }

        .med-sidebar {
            margin-top: 20px;
            background: #0a2a2f;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #0a3c44;
        }

        .med-sidebar h3 {
            color: #00eaff;
            margin-bottom: 15px;
        }

        .med-sidebar ul {
            list-style: none;
            padding: 0;
        }

        .med-sidebar li {
            padding: 12px;
            border-bottom: 1px solid #1e3f44;
            color: #a0e0e8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .add-medicine-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            background: #1e3f44;
            padding: 15px;
            border-radius: 16px;
        }

        .add-medicine-form input,
        .add-medicine-form select {
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #0a3c44;
            background: #0a2a2f;
            color: white;
            flex: 1 1 150px;
        }

        .add-medicine-form button {
            background: linear-gradient(135deg, #00eaff, #008b9c);
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            color: #02191c;
            font-weight: 600;
            cursor: pointer;
        }

        /* ----- LIVE LOCATION MODULE ----- */
        .map-container {
            height: 420px;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid #0a3c44;
            margin-bottom: 14px;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .gps-status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0a2a2f;
            border: 1px solid #0a3c44;
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .gps-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #444;
            flex-shrink: 0;
            transition: background 0.4s;
        }

        .gps-dot.active {
            background: #00ff9d;
            box-shadow: 0 0 8px #00ff9d;
        }

        .gps-dot.stale {
            background: #ffd600;
            box-shadow: 0 0 8px #ffd600;
        }

        .gps-dot.offline {
            background: #ef4444;
        }

        .gps-status-text {
            color: #00eaff;
            font-weight: 600;
            font-size: 0.9rem;
            flex: 1;
            min-width: 120px;
        }

        .gps-last-update {
            color: #6b8e94;
            font-size: 0.8rem;
            margin-left: auto;
        }

        .gps-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .gps-info-card {
            background: #0a2a2f;
            border: 1px solid #0a3c44;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .gps-info-label {
            color: #6b8e94;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .gps-info-value {
            color: #00eaff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .gps-info-value.highlight {
            color: #00ff9d;
        }

        .gps-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .gps-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #00eaff44;
            background: #0a3c44;
            color: #00eaff;
            font-size: 0.83rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: background 0.2s;
        }

        .gps-btn:hover {
            background: #0f5060;
        }

        .gps-btn.danger {
            border-color: #ef444444;
            background: #3c1010;
            color: #ef4444;
        }

        .gps-btn.danger:hover {
            background: #5a1a1a;
        }

        .gps-trail-section {
            background: #0a2a2f;
            border: 1px solid #0a3c44;
            border-radius: 14px;
            padding: 14px 16px;
        }

        .gps-trail-title {
            color: #00eaff;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .gps-trail-list {
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

    <script type="module">
        // ---------- FIREBASE INITIALIZATION ----------
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js';
        import { getDatabase, ref, set, onValue, get, child, push, query, orderByChild, limitToLast } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';
        // Firebase Storage not used — documents stored as Base64 in Realtime Database
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js';
        import { getMessaging, getToken, onMessage } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-messaging.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDfwHe6KqjN1cMRI_FlWXNsbPkBNuayt7w',
            authDomain: 'iot-patient-health-monit-c67f6.firebaseapp.com',
            databaseURL: 'https://iot-patient-health-monit-c67f6-default-rtdb.asia-southeast1.firebasedatabase.app',
            projectId: 'iot-patient-health-monit-c67f6',
            storageBucket: 'iot-patient-health-monit-c67f6.appspot.com',
            messagingSenderId: '415116190308',
            appId: '1:415116190308:web:03849521cd4846324af571'
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const db = getDatabase(firebaseApp);

        const auth = getAuth(firebaseApp);
        const messaging = getMessaging(firebaseApp);

        // ── FCM VAPID KEY ──────────────────────────────────────────────────────────
        // Get this from Firebase Console → Project Settings → Cloud Messaging
        // → Web Push certificates → Generate key pair → copy the Key pair value
        const FCM_VAPID_KEY = 'BIa1U1WehgwFDFbi0SefFsKxk_muMy4-dprvXtaj7sfKCdwaOkAf3RVBBGPnijsWbRWeOmZIH6pHBlOviY95I6A';
        // ──────────────────────────────────────────────────────────────────────────

        // ---------- FCM: Request permission, get token, save to DB ----------
        async function initFCM(user) {
            try {
                if (!('Notification' in window)) {
                    console.warn('FCM: Notifications not supported in this browser');
                    return;
                }
                if (!('serviceWorker' in navigator)) {
                    console.warn('FCM: Service workers not supported');
                    return;
                }
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    console.warn('FCM: Notification permission denied');
                    showFCMBanner('⚠️ Notifications blocked — enable them to receive medical alerts', '#ffd600');
                    return;
                }
                const swReg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                const token = await getToken(messaging, {
                    vapidKey: FCM_VAPID_KEY,
                    serviceWorkerRegistration: swReg
                });
                if (token) {
                    await set(ref(db, `users/${user.uid}/fcmToken`), token);
                    console.log('✅ FCM Token registered:', token);
                    showFCMBanner('🔔 Push notifications enabled', '#00ff9d');
                } else {
                    console.warn('FCM: No token retrieved — VAPID key may be invalid');
                }
            } catch (err) {
                console.error('FCM init error:', err);
            }
        }

        // ---------- FCM: Foreground message handler ----------
        onMessage(messaging, (payload) => {
            console.log('FCM foreground message:', payload);
            const title = payload.notification?.title || 'Medical Alert';
            const body = payload.notification?.body || '';

            // If this is a critical alert push AND the overlay isn't already showing,
            // trigger the full-screen overlay. Otherwise just toast.
            if (title.toUpperCase().includes('CRITICAL')) {
                const overlay = document.getElementById('criticalCallOverlay');
                if (!overlay?.classList.contains('active')) {
                    showCriticalOverlay({
                        timestamp: Date.now(),
                        triggers: [],          // vitals chips come from live healthData
                        patientName: cachedPatientName,
                        acknowledged: false
                    });
                }
            } else {
                showFCMToast(title, body);
            }
        });

        // ---------- FCM UI helpers ----------
        function showFCMToast(title, body) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position:fixed; bottom:24px; right:24px; z-index:9999;
                background:#0a2a2f; border:2px solid #00eaff; border-radius:16px;
                padding:16px 20px; max-width:320px; box-shadow:0 0 30px rgba(0,234,255,0.4);
                animation:fcmSlideIn 0.4s ease; color:#e6faff; font-family:'Inter',sans-serif;
            `;
            toast.innerHTML = `
                <div style="display:flex;align-items:flex-start;gap:12px;">
                    <span style="font-size:1.4rem;">🔔</span>
                    <div>
                        <div style="font-weight:700;color:#00eaff;margin-bottom:4px;">${title}</div>
                        <div style="font-size:0.9rem;color:#a0e0e8;">${body}</div>
                    </div>
                    <button onclick="this.closest('div').parentElement.remove()"
                        style="background:transparent;border:none;color:#6b8e94;cursor:pointer;font-size:1.1rem;margin-left:auto;">✕</button>
                </div>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 7000);
        }

        function showFCMBanner(msg, color) {
            const existing = document.getElementById('fcmBanner');
            if (existing) existing.remove();
            const banner = document.createElement('div');
            banner.id = 'fcmBanner';
            banner.style.cssText = `
                position:fixed; top:80px; left:50%; transform:translateX(-50%);
                z-index:9998; background:#0a2a2f; border:1px solid ${color};
                border-radius:30px; padding:8px 20px; color:${color};
                font-size:0.9rem; box-shadow:0 0 15px ${color}40;
                animation:fcmSlideIn 0.3s ease;
            `;
            banner.innerText = msg;
            document.body.appendChild(banner);
            setTimeout(() => banner.remove(), 4000);
        }

        // ---------- GLOBAL STATE ----------
        let currentUser = null;
        let healthData = {
            heartRate: null,
            spo2: null,
            temperature: null,
            timestamp: null,
            ecgWave: [],
            plethWave: [],
            respWave: []
        };

        let healthHistoryCache = [];
        let charts = {};
        let map = null;
        let mapMarker = null;
        let calendar = null;
        let animationFrame = null;

        // Listener flags (once)
        let healthListenerInitialized = false;
        let gpsListenerInitialized = false;
        let historyListenerInitialized = false;
        let lastHistoryWrite = 0;

        // ESP32 watchdog
        let lastESP32Update = 0;

        // ---------- CRITICAL ALERT STATE ----------
        let lastCriticalAlertSent = 0;       // debounce: min 60s between FCM sends
        let criticalSnoozedUntil = 0;       // snooze timestamp
        let criticalAlertAudio = null;    // ringtone audio context
        let criticalAudioNodes = [];      // oscillator nodes to stop
        let critAlertListenerSet = false;   // one-time Firebase listener flag
        let cachedPatientName = 'Patient'; // fetched once at login — avoids DB read on every alarm

        // ---------- ONVALUE UNSUBSCRIBE HANDLES ----------
        // Store the unsubscribe functions returned by onValue() so we can
        // cleanly detach all listeners on logout, preventing memory leaks
        // and duplicate callbacks on repeated login/logout cycles.
        let unsubHealth = null;
        let unsubGPS = null;
        let unsubHistory = null;
        let unsubDocs = null;
        let unsubMeds = null;
        let unsubCritical = null;

        // ---------- HELPER FUNCTIONS ----------
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function formatPhoneIndia(phone) {
            let cleaned = phone.replace(/[^\d+]/g, '');
            if (!cleaned.startsWith('+91')) cleaned = '+91' + cleaned.replace(/^0+/, '');
            return cleaned;
        }

        // ── CRITICAL ALERT RINGTONE (Web Audio API — no file needed) ────────────
        function playCriticalRingtone() {
            stopCriticalRingtone();
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                criticalAlertAudio = ctx;

                // Schedule repeating beep pattern without recursive calls
                // Pattern: 880Hz beep, 880Hz beep, 1100Hz beep — repeat every 2s
                const REPEAT_SEC = 2.0;
                const REPEAT_TIMES = 60;   // ~2 minutes max before auto-stop
                const pattern = [
                    { freq: 880, start: 0.00, dur: 0.10 },
                    { freq: 880, start: 0.24, dur: 0.10 },
                    { freq: 1100, start: 0.48, dur: 0.14 }
                ];

                for (let rep = 0; rep < REPEAT_TIMES; rep++) {
                    const repOffset = rep * REPEAT_SEC;
                    pattern.forEach(({ freq, start, dur }) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.type = 'square';
                        const t = ctx.currentTime + repOffset + start;
                        osc.frequency.setValueAtTime(freq, t);
                        gain.gain.setValueAtTime(0.16, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
                        osc.start(t);
                        osc.stop(t + dur + 0.01);
                        criticalAudioNodes.push(osc);
                    });
                }
            } catch (e) { console.warn('Audio ctx failed:', e); }
        }

        function stopCriticalRingtone() {
            if (criticalAlertAudio) {
                try { criticalAlertAudio.close(); } catch (e) { }
                criticalAlertAudio = null;
            }
            criticalAudioNodes.forEach(n => { try { n.stop(); } catch (e) { } });
            criticalAudioNodes = [];
        }

        // ── BUILD VITALS CHIPS for overlay ───────────────────────────────────
        function buildCritVitalsHTML(triggers) {
            const hr = healthData.heartRate;
            const spo2 = healthData.spo2;
            const temp = healthData.temperature;
            const resp = hr ? Math.round(hr / 4) : null;

            const chips = [
                { label: 'HR', value: hr ? hr + ' BPM' : '—', critical: triggers.includes('hr') },
                { label: 'SpO₂', value: spo2 ? spo2 + ' %' : '—', critical: triggers.includes('spo2') },
                { label: 'Temp', value: temp && temp > -50 ? temp.toFixed(1) + ' °C' : '—', critical: triggers.includes('temp') },
                { label: 'Resp', value: resp ? resp + ' brpm' : '—', critical: false }
            ];
            return chips.map(c =>
                `<div class="crit-vital-chip ${c.critical ? 'danger' : 'ok'}">
                    ${c.critical ? '⚠' : '✓'} ${c.label}: <strong>${c.value}</strong>
                </div>`
            ).join('');
        }

        // ── SHOW CRITICAL OVERLAY ────────────────────────────────────────────
        function showCriticalOverlay(alertData) {
            if (Date.now() < criticalSnoozedUntil) return;   // still snoozed

            const overlay = document.getElementById('criticalCallOverlay');
            if (!overlay) return;

            const triggers = alertData.triggers || [];
            const patName = alertData.patientName || 'Patient';

            document.getElementById('critPatientName').innerText = '👤 ' + patName;
            document.getElementById('critVitalsRow').innerHTML = buildCritVitalsHTML(triggers);

            overlay.classList.add('active');
            playCriticalRingtone();
        }

        // ── ACKNOWLEDGE / SNOOZE ─────────────────────────────────────────────
        window.acknowledgeCriticalAlert = () => {
            stopCriticalRingtone();
            document.getElementById('criticalCallOverlay').classList.remove('active');
            // Write acknowledged flag INSIDE /latest so the onValue listener sees it
            if (currentUser) {
                set(ref(db, `criticalAlerts/${currentUser.uid}/latest/acknowledged`), true)
                    .catch(console.error);
            }
        };

        window.dismissCriticalAlert = () => {
            stopCriticalRingtone();
            document.getElementById('criticalCallOverlay').classList.remove('active');
            criticalSnoozedUntil = Date.now() + 2 * 60 * 1000;   // snooze 2 min
        };

        // ── WRITE CRITICAL ALERT → Firebase (triggers FCM via listener) ──────
        async function triggerCriticalAlert(triggers, patientName) {
            if (!currentUser) return;
            const now = Date.now();
            // Debounce: don't re-trigger within 60 seconds
            if (now - lastCriticalAlertSent < 60000) return;
            lastCriticalAlertSent = now;

            const alertPayload = {
                timestamp: now,
                triggers: triggers,
                patientName: patientName || 'Patient',
                vitals: {
                    heartRate: healthData.heartRate,
                    spo2: healthData.spo2,
                    temperature: healthData.temperature
                },
                sentBy: currentUser.uid,
                acknowledged: false
            };

            // Show immediately on THIS device — no Firebase round-trip needed
            showCriticalOverlay(alertPayload);

            // Write to Firebase → sendNotification.js --watch picks this up and
            // fires FCM to ALL other registered devices/tabs
            await set(ref(db, `criticalAlerts/${currentUser.uid}/latest`), alertPayload).catch(console.error);
        }

        // ── LISTEN FOR CRITICAL ALERTS FROM FIREBASE (other devices/tabs) ──
        function startCriticalAlertListener() {
            if (!currentUser || critAlertListenerSet) return;
            critAlertListenerSet = true;

            unsubCritical = onValue(ref(db, `criticalAlerts/${currentUser.uid}/latest`), (snap) => {
                if (!snap.exists()) return;
                const alertData = snap.val();
                if (!alertData || !alertData.timestamp) return;
                // Ignore alerts older than 90 seconds
                if (Date.now() - alertData.timestamp > 90000) return;
                // Already acknowledged — don't re-show
                if (alertData.acknowledged) return;
                // showCriticalOverlay() already guards against the snooze window
                // Don't add an overlay.active guard here — other devices & tabs
                // need to see the overlay even if this device didn't trigger it
                showCriticalOverlay(alertData);
            });
        }

        // ── ALARM CHECK (called every healthData update) ─────────────────────
        function checkAlarms() {
            const hr = healthData.heartRate;
            const spo2 = healthData.spo2;
            const temp = healthData.temperature;

            const hrBlock = document.getElementById('hrValue')?.closest('.vital-block');
            const spo2Block = document.getElementById('spo2Value')?.closest('.vital-block');
            const tempBlock = document.getElementById('tempValue')?.closest('.vital-block');

            if (hrBlock) hrBlock.classList.remove('alarm-blink');
            if (spo2Block) spo2Block.classList.remove('alarm-blink');
            if (tempBlock) tempBlock.classList.remove('alarm-blink');

            const triggers = [];

            if (hr !== null && (hr > 120 || hr < 40)) {
                if (hrBlock) hrBlock.classList.add('alarm-blink');
                triggers.push('hr');
            }
            if (spo2 !== null && spo2 < 90) {
                if (spo2Block) spo2Block.classList.add('alarm-blink');
                triggers.push('spo2');
            }
            const validTemp = temp !== null && temp > -50 && temp < 60;
            if (validTemp && temp > 38.5) {
                if (tempBlock) tempBlock.classList.add('alarm-blink');
                triggers.push('temp');
            }

            if (triggers.length > 0) {
                // Use name cached at login — avoids a Firebase read on every critical update
                triggerCriticalAlert(triggers, cachedPatientName);
            }
        }

        // Update UI with current healthData
        function updateVitalUI() {
            const esp32Connected = lastESP32Update > 0 && (Date.now() - lastESP32Update < 8000);
            const waiting = '—';

            const hrEl = document.getElementById('hrValue');
            if (hrEl) hrEl.innerText = (esp32Connected && healthData.heartRate !== null) ? healthData.heartRate : waiting;

            const spo2El = document.getElementById('spo2Value');
            if (spo2El) spo2El.innerText = (esp32Connected && healthData.spo2 !== null) ? healthData.spo2 : waiting;

            const tempEl = document.getElementById('tempValue');
            const rawTemp = healthData.temperature;
            const validTemp = rawTemp !== null && rawTemp > -50 && rawTemp < 60;
            if (tempEl) tempEl.innerText = (esp32Connected && validTemp) ? rawTemp.toFixed(1) : waiting;

            const respEl = document.getElementById('respValue');
            if (respEl) respEl.innerText = (esp32Connected && healthData.heartRate !== null) ? Math.round(healthData.heartRate / 4) : waiting;

            updatePatientCondition();
            checkAlarms();
        }

        function updatePatientCondition() {
            const label = document.getElementById('patientConditionLabel');
            if (!label) return;

            if (healthData.heartRate === null || healthData.spo2 === null) {
                label.innerHTML = `<i class="fas fa-hourglass-half"></i> Waiting`;
                label.className = 'patient-status-badge status-waiting';
                return;
            }

            let status = 'Normal', cls = 'status-normal';
            let icon = 'fa-heartbeat';

            if (healthData.heartRate > 120 || healthData.heartRate < 40 || (healthData.spo2 !== null && healthData.spo2 < 85)) {
                status = 'Critical';
                cls = 'status-critical';
                icon = 'fa-exclamation-triangle';
            } else if (healthData.heartRate > 100 || healthData.heartRate < 50 || (healthData.spo2 !== null && healthData.spo2 < 92)) {
                status = 'Warning';
                cls = 'status-warning';
                icon = 'fa-exclamation-circle';
            }

            label.innerHTML = `<i class="fas ${icon}"></i> ${status}`;
            label.className = `patient-status-badge ${cls}`;
        }

                document.getElementById('lastUpdateTime').innerText = time;

        // ESP32 watchdog
        function startESPWatchdog() {
            setInterval(() => {
                const diff = Date.now() - lastESP32Update;
                if (diff > 8000 && lastESP32Update > 0) {
                    document.getElementById('espConnectionStatus').style.color = '#ef4444';
                    document.getElementById('espStatusText').innerText = 'Disconnected';
                } else if (lastESP32Update === 0) {

        window.handleLogin = async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const pwd = document.getElementById('loginPassword').value;
            if (!isValidEmail(email)) { document.getElementById('authError').innerText = 'Valid email required'; return; }
            if (pwd.length < 6) { document.getElementById('authError').innerText = 'Password min 6 chars'; return; }
            try {
                await signInWithEmailAndPassword(auth, email, pwd);
            } catch (e) {
                document.getElementById('authError').innerText = e.message;
            }
        };

        window.handleSignup = async () => {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const pwd = document.getElementById('signupPassword').value;
            let phone = document.getElementById('signupPhone').value.trim();

            if (!name) { document.getElementById('authError').innerText = 'Full name required'; return; }
            if (!isValidEmail(email)) { document.getElementById('authError').innerText = 'Valid email required'; return; }
            if (pwd.length < 6) { document.getElementById('authError').innerText = 'Password min 6 chars'; return; }

            phone = formatPhoneIndia(phone);
            if (!phone.match(/^\+91[0-9]{10}$/)) {
                document.getElementById('authError').innerText = 'Phone must be +91 followed by 10 digits';
                return;
            }

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pwd);
                await set(ref(db, 'users/' + cred.user.uid), {
                    name,
                    email,
                    phone,
                    createdAt: Date.now()
                });
            } catch (e) {
                document.getElementById('authError').innerText = e.message;
            }
        };

                const userData = snap.val() || { name: user.email };

                gpsListenerInitialized = false;

        // ---------- REAL HEALTH LISTENER ----------
        function startRealtimeHealthListener() {
            const healthRef = ref(db, 'healthData');
            unsubHealth = onValue(healthRef, (snap) => {
                const data = snap.val();
                if (!data) return;

                // Update healthData with real values
                healthData = {
                    heartRate: data.heartRate !== undefined ? data.heartRate : healthData.heartRate,
                    spo2: data.spo2 !== undefined ? data.spo2 : healthData.spo2,
                    temperature: data.temperature !== undefined ? data.temperature : healthData.temperature,
                    timestamp: data.timestamp || Date.now(),
                    ecgWave: data.ecgWave || healthData.ecgWave || [],
                    plethWave: data.plethWave || healthData.plethWave || [],
                    respWave: data.respWave || healthData.respWave || []
                };

                lastESP32Update = Date.now();
                updateVitalUI();

                document.getElementById('espConnectionStatus').style.color = '#00ff9d';
                document.getElementById('espStatusText').innerText = 'Connected';
                document.getElementById('patientConditionLabel').classList.remove('status-waiting');

                // Store in history every 5 seconds
                if (currentUser && Date.now() - lastHistoryWrite > 5000) {
                    const historyRef = ref(db, `health_history/${currentUser.uid}/${Date.now()}`);
                    set(historyRef, {
                        heartRate: healthData.heartRate,
                        spo2: healthData.spo2,
                        temperature: healthData.temperature,
                        timestamp: Date.now()
                    }).catch(console.error);
                    lastHistoryWrite = Date.now();
                }
            });
        }

        // ---------- GPS LISTENER ----------
        // ESP32 sends to: gpsData  →  fields: latitude, longitude (+ optional satellites, speed, altitude, timestamp)
        let gpsTrail = [];
        let gpsPolyline = null;
        let lastGPSLat = null, lastGPSLng = null;

        function startGPSFirebaseListener() {
            const gpsRef = ref(db, 'healthData');
            unsubGPS = onValue(gpsRef, (snap) => {
                const loc = snap.val();
                if (!loc) return;

                let lat = null, lng = null;
                if (loc.latitude !== undefined) lat = loc.latitude;
                else if (loc.lat !== undefined) lat = loc.lat;

                if (loc.longitude !== undefined) lng = loc.longitude;
                else if (loc.lng !== undefined) lng = loc.lng;

                if (lat === null || lng === null) return;

                lat = parseFloat(lat);
                lng = parseFloat(lng);
                if (isNaN(lat) || isNaN(lng) || (lat === 0 && lng === 0)) return;

                const latlng = { lat, lng };
                lastGPSLat = lat;
                lastGPSLng = lng;

                // ── Update info cards ──────────────────────────────────────
                const elLat = document.getElementById('gpsLat');
                const elLng = document.getElementById('gpsLng');
                const elDot = document.getElementById('gpsDot');
                const elStat = document.getElementById('gpsStatusText');
                const elUpd = document.getElementById('gpsLastUpdate');

                if (elLat) elLat.textContent = lat.toFixed(6);
                if (elLng) elLng.textContent = lng.toFixed(6);


                // ── Status dot ────────────────────────────────────────────
                const age = loc.timestamp ? Date.now() - loc.timestamp : 0;
                if (elDot) elDot.className = 'gps-dot ' + (age < 15000 ? 'active' : age < 60000 ? 'stale' : 'offline');
                if (elStat) elStat.innerHTML = '<i class="fas fa-satellite-dish"></i> Live GPS · NEO-6M via ESP32';
                if (elUpd) elUpd.textContent = 'Updated: ' + new Date().toLocaleTimeString();

                // ── Map marker ────────────────────────────────────────────
                if (map) {
                    if (mapMarker) {
                        mapMarker.setPosition(latlng);
                    } else {
                        mapMarker = new google.maps.Marker({
                            position: latlng,
                            map: map,
                            title: 'Patient (ESP32 GPS)',
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 10,
                                fillColor: '#00ff9d',
                                fillOpacity: 1,
                                strokeColor: '#ffffff',
                                strokeWeight: 2
                            },
                            animation: google.maps.Animation.DROP
                        });
                    }
                    map.panTo(latlng);
                }

                // ── Trail ─────────────────────────────────────────────────
                gpsTrail.push({ lat, lng, ts: loc.timestamp || Date.now() });
                if (gpsTrail.length > 50) gpsTrail.shift();

                if (map && gpsTrail.length > 1) {
                    const path = gpsTrail.map(p => ({ lat: p.lat, lng: p.lng }));
                    if (gpsPolyline) {
                        gpsPolyline.setPath(path);
                    } else {
                        gpsPolyline = new google.maps.Polyline({
                            path,
                            geodesic: true,
                            strokeColor: '#00eaff',
                            strokeOpacity: 0.7,
                            strokeWeight: 3,
                            map: map
                        });
                    }
                }
                updateGPSTrailList();
            });
        }

        function updateGPSTrailList() {
            const list = document.getElementById('gpsTrailList');
            const count = document.getElementById('trailCount');
            if (!list) return;
            if (count) count.textContent = `(${gpsTrail.length} point${gpsTrail.length !== 1 ? 's' : ''})`;
            list.innerHTML = [...gpsTrail].reverse().map((p, i) => `
                <div class="gps-trail-item">
                    <i class="fas fa-map-pin" style="color:${i === 0 ? '#00ff9d' : '#00eaff88'}"></i>

        // ---------- WAVEFORM ANIMATION — driven by real scalar values ----------
        function startWaveformAnimation() {
            const ecgCanvas = document.getElementById('ecgCanvas');
            const plethCanvas = document.getElementById('plethCanvas');
            const respCanvas = document.getElementById('respCanvas');

            if (!ecgCanvas || !plethCanvas || !respCanvas) {
                animationFrame = requestAnimationFrame(startWaveformAnimation);
                return;
            }



            const ctxEcg = ecgCanvas.getContext('2d');
            const ctxPleth = plethCanvas.getContext('2d');
            const ctxResp = respCanvas.getContext('2d');

            // ── "Waiting for ESP32" flat dashed baseline ──────────────────
            function drawWaiting(ctx, color) {
                const W = ctx.canvas.width, H = ctx.canvas.height;
                ctx.clearRect(0, 0, W, H);
                ctx.beginPath();
                ctx.moveTo(0, H / 2);
                ctx.lineTo(W, H / 2);
                ctx.strokeStyle = color + '44';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([6, 10]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.font = 'bold 13px "Courier New", monospace';
                ctx.fillStyle = color + '99';
                ctx.textAlign = 'center';
                ctx.fillText('\u23F3  Waiting for ESP32...', W / 2, H / 2 - 12);
            }

            // ── HEART RATE waveform — ECG P-QRS-T driven by BPM ──────────
            // phase  : elapsed time in seconds
            // bpm    : real heart rate from Firebase
            function drawHeartRateWave(ctx, bpm) {
                const W = ctx.canvas.width, H = ctx.canvas.height;
                ctx.clearRect(0, 0, W, H);

                const safeBpm = (bpm > 20 && bpm < 300) ? bpm : 75;
                const beatSec = 60 / safeBpm;          // seconds per beat
                const pxPerSec = W / 4;                 // 4-second window
                const now = Date.now() / 1000;

                // Glow effect
                ctx.shadowColor = '#00eaff';
                ctx.shadowBlur = 6;

                ctx.beginPath();
                ctx.strokeStyle = '#00eaff';
                ctx.lineWidth = 2;
                ctx.setLineDash([]);

                for (let px = 0; px < W; px++) {
                    const t = now - (W - px) / pxPerSec;   // time at this pixel
                    const raw = t % beatSec;
                    const phase = (raw >= 0 ? raw : raw + beatSec) / beatSec; // always 0..1
                    const mid = H / 2;
                    let y = mid;

                    // P wave  (0.08–0.18)
                    if (phase >= 0.08 && phase < 0.18) {
                        const p = (phase - 0.08) / 0.10;
                        y = mid - Math.sin(p * Math.PI) * H * 0.08;
                    }
                    // PR segment (0.18–0.26): flat
                    else if (phase >= 0.18 && phase < 0.26) {
                        y = mid;
                    }
                    // Q dip (0.26–0.30)
                    else if (phase >= 0.26 && phase < 0.30) {
                        const p = (phase - 0.26) / 0.04;
                        y = mid + p * H * 0.07;
                    }
                    // R spike up (0.30–0.36)
                    else if (phase >= 0.30 && phase < 0.36) {
                        const p = (phase - 0.30) / 0.06;
                        y = mid + H * 0.07 - Math.sin(p * Math.PI) * H * 0.72;
                    }
                    // S dip (0.36–0.42)
                    else if (phase >= 0.36 && phase < 0.42) {
                        const p = (phase - 0.36) / 0.06;
                        y = mid + Math.sin(p * Math.PI) * H * 0.15;
                    }
                    // ST segment (0.42–0.52): flat
                    else if (phase >= 0.42 && phase < 0.52) {
                        y = mid;
                    }
                    // T wave (0.52–0.72)
                    else if (phase >= 0.52 && phase < 0.72) {
                        const p = (phase - 0.52) / 0.20;
                        y = mid - Math.sin(p * Math.PI) * H * 0.14;
                    }
                    // baseline
                    else { y = mid; }

                    if (px === 0) ctx.moveTo(px, y);
                    else ctx.lineTo(px, y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // ── SpO2 PLETH waveform — smooth pulse driven by BPM ─────────
            function drawPlethWave(ctx, bpm, spo2) {
                const W = ctx.canvas.width, H = ctx.canvas.height;
                ctx.clearRect(0, 0, W, H);

                const safeBpm = (bpm > 20 && bpm < 300) ? bpm : 75;
                const beatSec = 60 / safeBpm;
                const pxPerSec = W / 4;
                const now = Date.now() / 1000;

                // Amplitude scales slightly with SpO2: lower SpO2 → smaller wave
                const amp = H * 0.35 * (spo2 ? Math.max(0.5, spo2 / 100) : 0.9);

                ctx.shadowColor = '#00bcd4';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.strokeStyle = '#00bcd4';
                ctx.lineWidth = 2;
                ctx.setLineDash([]);

                for (let px = 0; px < W; px++) {
                    const t = now - (W - px) / pxPerSec;
                    const rawPh = t % beatSec;
                    const phase = (rawPh >= 0 ? rawPh : rawPh + beatSec) / beatSec; // always 0..1
                    const mid = H * 0.55;

                    // Systolic rise (0.0–0.25), dicrotic notch (0.25–0.40), diastolic (0.40–1.0)
                    let y;
                    if (phase < 0.25) {
                        y = mid - Math.sin((phase / 0.25) * Math.PI) * amp;
                    } else if (phase < 0.40) {
                        const p = (phase - 0.25) / 0.15;
                        y = mid - Math.sin(p * Math.PI) * amp * 0.18;
                    } else {
                        y = mid;
                    }

                    if (px === 0) ctx.moveTo(px, y);
                    else ctx.lineTo(px, y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // ── RESPIRATION waveform — slow sine driven by breaths/min ───
            function drawRespWave(ctx, respRate) {
                const W = ctx.canvas.width, H = ctx.canvas.height;
                ctx.clearRect(0, 0, W, H);

                const safeRate = (respRate > 2 && respRate < 60) ? respRate : 16;
                const cycleSec = 60 / safeRate;
                const pxPerSec = W / 10;     // 10-second window for slow wave
                const now = Date.now() / 1000;

                ctx.shadowColor = '#ffeb3b';
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.strokeStyle = '#ffeb3b';
                ctx.lineWidth = 2;
                ctx.setLineDash([]);

                for (let px = 0; px < W; px++) {
                    const t = now - (W - px) / pxPerSec;
                    const rawRp = t % cycleSec;
                    const phase = (rawRp >= 0 ? rawRp : rawRp + cycleSec) / cycleSec; // always 0..1
                    const mid = H / 2;
                    const amp = H * 0.35;
                    // Inhale (0–0.45): rise, hold (0.45–0.55): flat, exhale (0.55–1.0): fall
                    let y;
                    if (phase < 0.45) {
                        y = mid - Math.sin((phase / 0.45) * Math.PI) * amp;
                    } else if (phase < 0.55) {
                        y = mid;
                    } else {
                        y = mid + Math.sin(((phase - 0.55) / 0.45) * Math.PI) * amp * 0.5;
                    }
                    if (px === 0) ctx.moveTo(px, y);
                    else ctx.lineTo(px, y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // ── main render loop ──────────────────────────────────────────
            function render() {
                const esp32Connected = lastESP32Update > 0 && (Date.now() - lastESP32Update < 8000);

                if (!esp32Connected) {
                    drawWaiting(ctxEcg, '#00eaff');
                    drawWaiting(ctxPleth, '#00bcd4');
                    drawWaiting(ctxResp, '#ffeb3b');
                } else {
                    const hr = healthData.heartRate || 75;
                    const spo2 = healthData.spo2 || 97;
                    const respRate = Math.round(hr / 4);   // estimated from HR

                    drawHeartRateWave(ctxEcg, hr);
                    drawPlethWave(ctxPleth, hr, spo2);
                    drawRespWave(ctxResp, respRate);
                }

                animationFrame = requestAnimationFrame(render);
            }
            render();
        }

        // ---------- DOCUMENTS (Base64 → Realtime Database, no Firebase Storage needed) ----------
        window.uploadDocument = async (input) => {
            if (!input.files.length || !currentUser) return;
            const file = input.files[0];

            const allowedTypes = ['application/pdf', 'image/jpeg', 'image/png'];
            if (!allowedTypes.includes(file.type)) {
                alert('Only PDF, JPG, PNG files are allowed');
                input.value = ''; return;
            }

            if (file.size > 1 * 1024 * 1024) {
                alert('❌ File too large. Maximum size is 1 MB.\n\nTip: Compress images or split large PDFs before uploading.');
                input.value = ''; return;
            }

            const progressWrap = document.getElementById('uploadProgress');
            const progressBar = document.getElementById('uploadProgressBar');
            const statusText = document.getElementById('uploadStatusText');
            const uploadArea = document.getElementById('uploadArea');
            if (progressWrap) progressWrap.style.display = 'block';
            if (uploadArea) uploadArea.style.pointerEvents = 'none';
            if (statusText) statusText.textContent = 'Reading file…';
            if (progressBar) progressBar.style.width = '20%';

            try {
                const base64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(new Error('Failed to read file'));
                    reader.readAsDataURL(file);
                });

                if (statusText) statusText.textContent = 'Saving to database…';
                if (progressBar) progressBar.style.width = '65%';

                const docId = Date.now().toString();
                await set(ref(db, `documents/${currentUser.uid}/${docId}`), {
                    fileName: file.name,
                    fileType: file.type,
                    fileSize: file.size,
                    base64Data: base64,
                    uploadedAt: Date.now()
                });

                if (progressBar) progressBar.style.width = '100%';
                if (statusText) statusText.textContent = '✅ Uploaded successfully!';
                setTimeout(() => {
                    if (progressWrap) progressWrap.style.display = 'none';
                    if (progressBar) progressBar.style.width = '0%';
                    if (uploadArea) uploadArea.style.pointerEvents = '';
                }, 1200);
                input.value = '';

            } catch (e) {
                if (progressWrap) progressWrap.style.display = 'none';
                if (uploadArea) uploadArea.style.pointerEvents = '';
                alert('❌ Upload failed: ' + e.message);
                input.value = '';
            }
        };

                const btn = document.getElementById('period' + p.charAt(0).toUpperCase() + p.slice(1));

        function getFilteredHistory() {
            if (!healthHistoryCache.length) return [];
            const now = Date.now();
            let cutoff;
            let maxPoints;
            if (currentChartPeriod === 'daily') {
                cutoff = now - 24 * 60 * 60 * 1000;
                maxPoints = 24;
            } else if (currentChartPeriod === 'weekly') {
                cutoff = now - 7 * 24 * 60 * 60 * 1000;
                maxPoints = 28;
            } else {
                cutoff = now - 30 * 24 * 60 * 60 * 1000;
                maxPoints = 30;
            }

            // Filter by time window, then downsample to maxPoints
            const sorted = [...healthHistoryCache]
                .filter(h => h.timestamp && h.timestamp >= cutoff)
                .sort((a, b) => a.timestamp - b.timestamp);

            if (sorted.length <= maxPoints) return sorted;

            // Evenly sample maxPoints entries
            const step = sorted.length / maxPoints;
            return Array.from({ length: maxPoints }, (_, i) => sorted[Math.floor(i * step)]);
        }

        function makeLabel(h) {
            if (!h.timestamp) return '';
            const d = new Date(h.timestamp);
            if (currentChartPeriod === 'daily') {
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (currentChartPeriod === 'weekly') {
                return d.toLocaleDateString([], { weekday: 'short', hour: '2-digit' });
            } else {
                return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
        }

                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#a0e0e8',
                                usePointStyle: true,
                                pointStyleWidth: 10,
                                font: { size: 12 }
                            }
                        },
                        tooltip: {
                            backgroundColor: '#0a2a2f',
                            borderColor: '#0a3c44',
                            borderWidth: 1,
                            titleColor: '#00eaff',
                            bodyColor: '#a0e0e8'
                        }
                    },
                    scales: {
                        yLeft: {
                            type: 'linear',
                            position: 'left',
                            grid: { color: '#0a3c44' },
                            ticks: { color: '#a0e0e8' },
                            title: { display: true, text: 'HR / SpO₂', color: '#6b8e94', font: { size: 11 } }
                        },
                        yRight: {
                            type: 'linear',
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#ff6b6b' },
                            title: { display: true, text: 'Temp (°C)', color: '#ff6b6b', font: { size: 11 } },
                            min: 30,
                            max: 42
                        },
                        x: {
                            grid: { color: '#0a3c44' },
                            ticks: {
                                color: '#a0e0e8',
                                maxTicksLimit: 10,
                                maxRotation: 30
                            }
                        }
                    }
                }
            });
        }

        function runProgressAnalysis() {
            const hr = healthData.heartRate;
            const spo2 = healthData.spo2;
            const temp = healthData.temperature;

            // Calculate risk percentages based on real data
            const cardio = hr ? Math.min(95, Math.max(5, 20 + (hr - 70) * 2)) : 0;
            const diabetes = temp ? Math.min(90, Math.max(5, 30 + (temp - 36.5) * 15)) : 0;
            const resp = spo2 ? Math.min(85, Math.max(5, 10 + (100 - spo2) * 3)) : 0;

            document.getElementById('riskCardio').style.width = cardio + '%';
            document.getElementById('riskDiabetes').style.width = diabetes + '%';
            document.getElementById('riskResp').style.width = resp + '%';

            document.getElementById('riskCardioText').innerText = cardio ? cardio + '% risk' : '—';
            document.getElementById('riskDiabetesText').innerText = diabetes ? diabetes + '% risk' : '—';
            document.getElementById('riskRespText').innerText = resp ? resp + '% risk' : '—';

            let summary = '';
            let recs = [];

            if (hr === null || spo2 === null) {
                summary = 'Waiting for ESP32 data...';
                recs = ['No data available yet'];
            } else {
                if (hr > 100) {
                    summary += 'Elevated heart rate. ';
                    recs.push('Monitor heart rate closely');
                } else if (hr < 50) {
                    summary += 'Low heart rate. ';
                    recs.push('Consult cardiologist');
                } else {
                    summary += 'Heart rate normal. ';
                }

                if (spo2 < 92) {
                    summary += 'Low oxygen saturation. ';
                    recs.push('Consider supplemental oxygen');
                } else if (spo2 < 95) {
                    summary += 'Oxygen slightly below optimal. ';
                    recs.push('Practice deep breathing exercises');
                } else {
                    summary += 'Oxygen levels good. ';
                }

                if (temp > 37.5) {
                    summary += 'Mild fever detected. ';
                    recs.push('Stay hydrated and monitor temperature');
                }
            }

            if (recs.length === 0 && hr !== null) {
                recs = ['Continue current treatment plan', 'Schedule follow-up in 2 weeks'];
            }

            document.getElementById('progressSummary').innerText = summary || 'All vitals within normal range.';
            document.getElementById('progressRecList').innerHTML = recs.map(r =>
                `<li><i class="fas fa-check-circle"></i> <span>${r}</span></li>`
            ).join('');
        }

        // Close mobile dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.mobile-menu-toggle') && !e.target.closest('.mobile-dropdown')) {
                document.getElementById('mobileDropdown').style.display = 'none';
            }
        });

        // PWA Install Logic
        let deferredPrompt;
        const installAppBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installAppBtn) {
                installAppBtn.style.display = 'flex';
            }
        });

        if (installAppBtn) {
            installAppBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                    installAppBtn.style.display = 'none';
                }
            });
        }

        window.addEventListener('appinstalled', () => {
            if (installAppBtn) {
                installAppBtn.style.display = 'none';
            }
            console.log('PWA was installed');
        });

        // Initialize with login tab
        switchAuthTab('login');
    </script>
</body>

</html>
